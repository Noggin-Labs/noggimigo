[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noggimigo"
version = "0.0.1"
description = "Closed-loop Socratic AI tutor for special education students and computational neuroscience research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "noggimigo contributors" },
]
keywords = [
    "special-education",
    "ai-tutoring",
    "python3",
    "nfot",
    "adaptive-learning",
    "chess",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Computational Neuroscience/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.51.0",
    "torch>=2.6.0",
    "accelerate>=1.2.0",
]

chess = [
    "python-chess>=1.999",
]

test = [
    "pytest>=8.0",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/Noggin-Labs/noggimigo"
Issues = "https://github.com/Noggin-Labs/noggimigo/issues"

[tool.setuptools.packages.find]
include = ["noggimigo*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "e2e: marks tests as end-to-end",
    "needs_gpu: marks tests that require a CUDA device",
    "needs_internet: marks tests that need network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"noggimigo/tutor_rl/judge.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
