[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noggimigo"
version = "0.0.1"
description = "Closed-loop Socratic AI tutor for special education students and theoretical neuroscience research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "noggimigo contributors" },
]
keywords = ["special-education", "ai-tutoring", "python3", "nfot", "adaptive-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Scientific Research and Special Education",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Theoretical Neuroscience:: Artificial Intelligence",
]
dependencies = [
    # Pure-Python core. Heavy ML deps live in optional extras. Everything here
    # is imported by the package; a dependency nothing imports is a promise
    # about the environment that nothing checks.
    "pyyaml>=6.0",
    "numpy>=1.24",
]


[project.urls]
Homepage = "https://github.com/Noggin-Labs/noggimigo"
Issues = "https://github.com/Noggin-Labs/noggimigo/issues"

[tool.setuptools.packages.find]
include = ["noggimigo*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (run with `pytest -m slow`)",
    "e2e: marks tests as end-to-end (run manually; not on CI)",
    "needs_gpu: marks tests that require a CUDA device",
    "needs_internet: marks tests that need network access (model / data download)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",  # too many arguments — common in dataclass __init__ via keyword
    "PLR2004",  # magic number — readable as inline constants in metric impls
]

[tool.ruff.lint.per-file-ignores]
# The judge's two prompts are reproduced verbatim from the run that produced
# the recorded labels, so their lines cannot be rewrapped.
"studentsim/tutor_rl/judge.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
